<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" role="img" aria-label="Hex nut circuit logo">
  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="#070b14"/>
  <!-- traces: one arm, repeated every 120 degrees -->
  <defs>
    <g id="arm">
      <path d="M32 18V12L37.2 9" fill="none" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="37.2" cy="9" r="3.5" fill="#e2e8f0"/>
    </g>
  </defs>
  <use xlink:href="#arm" href="#arm"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(120 32 32)"/>
  <use xlink:href="#arm" href="#arm" transform="rotate(240 32 32)"/>
  <!-- hex nut -->
  <path d="M32 18L44.12 25V39L32 46L19.88 39V25Z" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="3" stroke-linejoin="round"/>
  <!-- bore -->
  <circle cx="32" cy="32" r="6" fill="#2563eb"/>
</svg>
